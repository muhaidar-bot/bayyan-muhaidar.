<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="plumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0e38" />
      <stop offset="50%" stop-color="#2a082b" />
      <stop offset="100%" stop-color="#15031b" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d79" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff7597" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff7597" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app squircle -->
  <rect width="512" height="512" rx="128" fill="url(#plumGrad)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="rgba(255, 149, 175, 0.25)" stroke-width="4" />
  <circle cx="256" cy="220" r="180" fill="url(#glow)" />

  <!-- Romantic Heart Motif -->
  <g filter="url(#softGlow)">
    <path d="M256 410 C256 410, 110 310, 110 200 C110 135, 160 90, 220 90 C242 90, 252 102, 256 110 C260 102, 270 90, 292 90 C352 90, 402 135, 402 200 C402 310, 256 410, 256 410 Z" fill="url(#heartGrad)" />
  </g>

  <!-- Elegant Monogram Initials B ❤️ M -->
  <text x="256" y="240" font-family="'Playfair Display', Georgia, serif" font-size="64" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="4">B ❤️ M</text>
  
  <!-- Subtle subtitle -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="600" fill="#ffb3c6" text-anchor="middle" letter-spacing="6">BAYYAN &amp; MUHAIDAR</text>
</svg>
